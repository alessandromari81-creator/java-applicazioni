# FILE: application-test.properties
# A COSA SERVE: configurazione usata SOLO dai test che attivano il profilo "test" con
# @ActiveProfiles("test"). Si somma a application.properties e sovrascrive solo ciò che è scritto qui.
# Ai test non serve PostgreSQL: usano H2 in memoria (veloce, nessun Docker), con le tabelle create da
# Hibernate dalle classi @Entity invece che dalle migration di Flyway.
# PARAGONE LARAVEL: il file .env.testing / phpunit.xml con DB_CONNECTION=sqlite in memoria.
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
