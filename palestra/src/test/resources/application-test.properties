# FILE: application-test.properties
# A COSA SERVE: configurazione usata SOLO dai test che attivano il profilo "test" con
# @ActiveProfiles("test"). Si somma a application.properties e sovrascrive solo ciò che è scritto qui.
# Ai test non serve PostgreSQL: usano H2 in memoria (veloce, nessun Docker), con le tabelle create da
# Hibernate dalle classi @Entity invece che dalle migration di Flyway.
# PARAGONE LARAVEL: il file .env.testing / phpunit.xml con DB_CONNECTION=sqlite in memoria.
# Nome del database in memoria UNICO per ogni avvio (${random.uuid}): più contesti Spring nella stessa esecuzione dei
# test non condividono (e non si cancellano a vicenda) le tabelle. DB_CLOSE_DELAY=-1 evita che H2 si chiuda
# quando si chiude l'ultima connessione.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Statistiche di Hibernate: permettono ai test di CONTARE le query eseguite da una richiesta (per provare che le liste
# non fanno una query per ogni riga e che la paginazione usa la "query in due passi").
spring.jpa.properties.hibernate.generate_statistics=true

# Nei test non parte nessun compito programmato (la pulizia si prova chiamando direttamente il metodo).
app.pulizia.attiva=false

# Registra le istruzioni SQL con LIKE, per controllare la forma della query di ricerca (RicercaSqlTest).
spring.jpa.properties.hibernate.session_factory.statement_inspector=it.palestra.RegistratoreSql
