# FILE: application-concorrenza.properties
# A COSA SERVE: configurazione dei test di concorrenza (UltimoAdminConcorrenzaTest), che usano un PostgreSQL VERO avviato da
# Testcontainers. Si attiva insieme al profilo "test" (@ActiveProfiles({"test", "concorrenza"})) e ne sovrascrive due punti:
#   - Flyway è ACCESO: lo schema lo creano le migration vere, come in produzione (nel profilo "test" è spento e le tabelle le crea Hibernate per H2);
#   - Hibernate si limita a CONTROLLARE lo schema (validate), senza crearlo.
# L'indirizzo del database non è scritto qui: lo imposta @ServiceConnection sul contenitore (vince su spring.datasource.url del profilo "test").
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
