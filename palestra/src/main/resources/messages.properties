# FILE: messages.properties
# A COSA SERVE: testi dei messaggi di errore che Spring genera da solo, che altrimenti sarebbero tecnici e in inglese
# (es. "Failed to convert property value of type 'java.lang.String' to required type 'java.time.LocalDate'...").
