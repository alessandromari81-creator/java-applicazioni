# FILE: application.properties
# A COSA SERVE: configurazione dell'applicazione (chiave=valore). Spring la legge all'avvio.
# PARAGONE LARAVEL: il file .env + la cartella config/ insieme.

# Nome dell'applicazione (usato nei log e dagli strumenti di monitoraggio).
spring.application.name=palestra

# Credenziali del PRIMO amministratore: AdminIniziale lo crea all'avvio SOLO se nel database non c'è nessun utente
# con ruolo ADMIN, cifrando la password. Dopo il primo avvio l'admin vive nel database: cambiare questi valori non
# modifica quello già salvato. Il login si fa con l'EMAIL. Sono nomi nostri ("app.admin.*"), scelti liberamente.
# Solo per sviluppo: non committare password vere!
app.admin.email=admin@palestra.local
app.admin.password=admin

# --- Token JWT per la API REST (vedi JwtConfig e JwtService) ---
# Chiave segreta con cui il server FIRMA i token: chi la conosce può fabbricare token validi, quindi in un ambiente
# reale va impostata con la variabile d'ambiente JWT_SECRET (una stringa lunga e casuale) e MAI scritta qui né
# committata. Il valore dopo i due punti è solo per lo sviluppo. Minimo 32 caratteri, altrimenti l'app non parte.
app.jwt.secret=${JWT_SECRET:chiave-solo-per-sviluppo-cambiala-in-produzione-0123456789}
# Quanto dura un token, in minuti: breve = meno danni se viene rubato (poi si rifà il login).
app.jwt.durata-minuti=60
# Quanto dura un refresh token, in giorni: serve a ottenere un nuovo access token senza rifare il login. Ogni rinnovo ne
# emette uno nuovo (rotazione), quindi finché si usa la API la sessione si allunga; se non la si usa per più di questo
# tempo bisogna rifare il login.
app.jwt.refresh-durata-giorni=7

# --- Database PostgreSQL (avviato con `docker compose up -d`, vedi compose.yaml) ---
# La sintassi ${NOME:valore} legge la variabile d'ambiente NOME e, se manca, usa il valore dopo i due punti
# (come env('DB_USER', 'palestra') in Laravel). In produzione si impostano le variabili, senza toccare il file.
spring.datasource.url=jdbc:postgresql://localhost:5432/palestra
spring.datasource.username=${DB_USER:palestra}
spring.datasource.password=${DB_PASSWORD:palestra}

# Lo schema ora lo gestisce FLYWAY con le migration in src/main/resources/db/migration (parte da solo
# all'avvio). Hibernate non crea più le tabelle: "validate" si limita a CONTROLLARE che le tabelle
# corrispondano alle classi @Entity, e se non coincidono l'app non parte (errore subito, non a runtime).
spring.jpa.hibernate.ddl-auto=validate

# Disattiva "open-in-view": evita che le query al DB partano durante il rendering del template.
# È la buona pratica: i dati necessari si caricano nel service (per questo usiamo @EntityGraph).
spring.jpa.open-in-view=false

# --- Pagine/risposte di errore ---
# Non mostrare MAI all'utente stack trace, nome dell'eccezione o messaggi tecnici: aiutano chi attacca
# il sito. I dettagli completi restano nel log del server (come APP_DEBUG=false in Laravel).
# Nota: in Spring Boot 4 queste proprietà si chiamano spring.web.error.*; le vecchie server.error.*
# sono deprecate e non funzionano più.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# CACHE (Spring Cache + Caffeine, in memoria). Esiste una sola cache, "ruoli" (l'elenco ADMIN/ISTRUTTORE/ISCRITTO, che cambia
# solo con una migration). maximumSize = massimo di voci; expireAfterWrite = dopo quanto una voce scade da sola (rete di
# sicurezza: se un giorno i ruoli cambiassero a mano nel database, entro un'ora l'app li rilegge); recordStats = conta
# hit/miss (servono ai test e, in futuro, al monitoraggio). PARAGONE LARAVEL: config/cache.php con driver "array" e TTL.
spring.cache.type=caffeine
spring.cache.cache-names=ruoli
spring.cache.caffeine.spec=maximumSize=50,expireAfterWrite=1h,recordStats
