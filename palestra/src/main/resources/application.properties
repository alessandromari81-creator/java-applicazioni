# FILE: application.properties
# A COSA SERVE: configurazione dell'applicazione (chiave=valore). Spring la legge all'avvio.
# PARAGONE LARAVEL: il file .env + la cartella config/ insieme.

# Nome dell'applicazione (usato nei log e dagli strumenti di monitoraggio).
spring.application.name=palestra

# Credenziali dell'admin per il login: lette da SecurityConfig con @Value("${app.admin.username}").
# "app.admin.*" è un nome nostro, scelto liberamente. Solo per sviluppo: non committare password vere!
app.admin.username=admin
app.admin.password=admin

# Il database H2 è in memoria: sparisce quando fermi l'app.
# create-drop = Hibernate CREA le tabelle dalle classi @Entity all'avvio e le CANCELLA alla chiusura
# (equivale a un migrate:fresh automatico; con Flyway useremo vere migration).
spring.jpa.hibernate.ddl-auto=create-drop

# Disattiva "open-in-view": evita che le query al DB partano durante il rendering del template.
# È la buona pratica: i dati necessari si caricano nel service (per questo usiamo @EntityGraph).
spring.jpa.open-in-view=false

# --- Pagine/risposte di errore ---
# Non mostrare MAI all'utente stack trace, nome dell'eccezione o messaggi tecnici: aiutano chi attacca
# il sito. I dettagli completi restano nel log del server (come APP_DEBUG=false in Laravel).
# Nota: in Spring Boot 4 queste proprietà si chiamano spring.web.error.*; le vecchie server.error.*
# sono deprecate e non funzionano più (le avevo usate per errore prima).
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
