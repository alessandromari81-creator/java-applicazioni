# FILE: application.properties
# A COSA SERVE: configurazione dell'applicazione (chiave=valore). Spring la legge all'avvio.
# PARAGONE LARAVEL: il file .env + la cartella config/ insieme.

# Nome dell'applicazione (usato nei log e dagli strumenti di monitoraggio).
spring.application.name=palestra

# Credenziali del PRIMO amministratore: AdminIniziale lo crea all'avvio SOLO se nel database non c'è nessun utente
# con ruolo ADMIN, cifrando la password. Dopo il primo avvio l'admin vive nel database: cambiare questi valori non
# modifica quello già salvato. Il login si fa con l'EMAIL. Sono nomi nostri ("app.admin.*"), scelti liberamente.
# Solo per sviluppo: non committare password vere!
app.admin.email=admin@palestra.local
app.admin.password=admin

# --- Token JWT per la API REST (vedi JwtConfig e JwtService) ---
# Chiave segreta con cui il server FIRMA i token: chi la conosce può fabbricare token validi, quindi in un ambiente
# reale va impostata con la variabile d'ambiente JWT_SECRET (una stringa lunga e casuale) e MAI scritta qui né
# committata. Il valore dopo i due punti è solo per lo sviluppo. Minimo 32 caratteri, altrimenti l'app non parte.
app.jwt.secret=${JWT_SECRET:chiave-solo-per-sviluppo-cambiala-in-produzione-0123456789}
# Quanto dura un token, in minuti: breve = meno danni se viene rubato (poi si rifà il login).
app.jwt.durata-minuti=60
# Quanto dura un refresh token, in giorni: serve a ottenere un nuovo access token senza rifare il login. Ogni rinnovo ne
# emette uno nuovo (rotazione), quindi finché si usa la API la sessione si allunga; se non la si usa per più di questo
# tempo bisogna rifare il login.
app.jwt.refresh-durata-giorni=7

# --- Database PostgreSQL (avviato con `docker compose up -d`, vedi compose.yaml) ---
# La sintassi ${NOME:valore} legge la variabile d'ambiente NOME e, se manca, usa il valore dopo i due punti.
# In produzione si impostano le variabili, senza toccare il file.
spring.datasource.url=jdbc:postgresql://localhost:5432/palestra
spring.datasource.username=${DB_USER:palestra}
spring.datasource.password=${DB_PASSWORD:palestra}

# Lo schema ora lo gestisce FLYWAY con le migration in src/main/resources/db/migration (parte da solo
# all'avvio). Hibernate non crea più le tabelle: "validate" si limita a CONTROLLARE che le tabelle
# corrispondano alle classi @Entity, e se non coincidono l'app non parte (errore subito, non a runtime).
spring.jpa.hibernate.ddl-auto=validate

# Disattiva "open-in-view": evita che le query al DB partano durante il rendering del template.
# È la buona pratica: i dati necessari si caricano nel service (per questo usiamo @EntityGraph).
spring.jpa.open-in-view=false

# --- Pagine/risposte di errore ---
# Non mostrare MAI all'utente stack trace, nome dell'eccezione o messaggi tecnici: aiutano chi attacca
# il sito. I dettagli completi restano nel log del server.
# Nota: in Spring Boot 4 queste proprietà si chiamano spring.web.error.*; le vecchie server.error.*
# sono deprecate e non funzionano più.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# CACHE (Spring Cache + Caffeine, in memoria). Esiste una sola cache, "ruoli" (l'elenco ADMIN/ISTRUTTORE/ISCRITTO, che cambia
# solo con una migration). maximumSize = massimo di voci; expireAfterWrite = dopo quanto una voce scade da sola (rete di
# sicurezza: se un giorno i ruoli cambiassero a mano nel database, entro un'ora l'app li rilegge); recordStats = conta
# hit/miss (servono ai test e, in futuro, al monitoraggio).
spring.cache.type=caffeine
spring.cache.cache-names=ruoli
spring.cache.caffeine.spec=maximumSize=50,expireAfterWrite=1h,recordStats

# SWAGGER / OpenAPI (springdoc). La pagina interattiva è su /swagger-ui.html e il JSON su /v3/api-docs. Il pannello le protegge già:
# restano nella catena "pagine" di SecurityConfig, quindi servono login e ruolo ADMIN (non sono pubbliche). Per SPEGNERLE (es. in
# produzione) imposta SPRINGDOC_ENABLED=false. paths-to-match = documenta solo /api (non le pagine HTML del pannello).
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Nella pagina Swagger si ricorda il token incollato in «Authorize» anche ricaricando.
springdoc.swagger-ui.persist-authorization=true

# PULIZIA PROGRAMMATA dei refresh token scaduti: attiva = interruttore generale; cron = quando gira ("secondi minuti ore giorno mese
# giornoSettimana"; qui ogni giorno alle 03:30).
app.pulizia.attiva=true
app.pulizia.cron=0 30 3 * * *

# LIMITE AI TENTATIVI DI LOGIN (API e form del pannello). Vedi LimiteTentativiLogin: max falliti per coppia IP+email, max falliti per
# solo IP, e durata della finestra (si conta dal primo fallimento; scaduta, si riparte da zero).
app.sicurezza.login-max-tentativi=5
app.sicurezza.login-max-tentativi-per-ip=20
app.sicurezza.login-finestra-minuti=15

# PRIVACY. Versione del testo dell'informativa (pagina /privacy): chi si registra accetta QUESTA versione e il numero viene salvato insieme al
# consenso. Quando si modifica il testo di privacy.html si aggiorna anche questo valore.
app.privacy.versione=2026-11

# EMAIL. Le email (conferma registrazione, password dimenticata, invito) partono via SMTP. In sviluppo si usa Mailpit (compose.yaml): SMTP su
# localhost:1025 e pagina web per leggere i messaggi su http://localhost:8025. Dentro Docker l'host del server di posta è "mailpit"
# (SPRING_MAIL_HOST). In produzione vanno impostati host, porta e credenziali del proprio provider (spring.mail.*).
spring.mail.host=localhost
spring.mail.port=1025
# TIMEOUT DELL'SMTP (in millisecondi). Senza, un server di posta che non risponde fa aspettare l'invio a lungo (nella prova, circa 43 secondi; in altre condizioni di rete minuti o per sempre):
# il lavoratore della coda delle email (SpedizioneEmailProgrammata) occuperebbe l'unico thread dei compiti programmati, bloccando anche la pulizia notturna.
# connectiontimeout = tempo massimo per collegarsi; timeout = tempo massimo di attesa di una risposta; writetimeout = tempo massimo per inviare i dati.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.email.mittente=Palestra <no-reply@palestra.local>

# Indirizzo base con cui si costruiscono i link nelle email (registrazione, password). Si legge SOLO da qui, mai dalla richiesta: l'intestazione Host si
# può falsificare e finirebbe nei link spediti agli utenti. In produzione va impostato con l'indirizzo pubblico del sito (APP_URL_PUBBLICO).
app.url-pubblico=${APP_URL_PUBBLICO:http://localhost:8080}

# DURATA dei link ricevuti per email. reset = "password dimenticata"; attivazione = invito dell'amministratore a impostare la password;
# registrazione = conferma dell'email di chi si iscrive da solo. pausa = tempo minimo prima di rispedire un'email alla stessa persona.
app.token.reset-minuti=60
app.token.attivazione-ore=24
app.token.registrazione-ore=24
app.token.pausa-minuti=2

# LIMITE alle richieste che fanno partire un'email (vedi LimiteRichiesteEmail): max per coppia IP+email, max per solo IP, finestra in minuti.
app.sicurezza.email-max-richieste=5
app.sicurezza.email-max-richieste-per-ip=20
app.sicurezza.email-finestra-minuti=60

# CODA DELLE EMAIL. Con attiva=true (predefinito) l'email non parte dentro la richiesta: si scrive una riga nella tabella email_in_coda e un compito
# programmato (SpedizioneEmailProgrammata) la spedisce entro pochi secondi, riprovando se il server di posta non risponde. Con false l'email parte subito
# (come prima). intervallo-ms = pausa tra un giro e l'altro; gruppo = quante email per giro; max-tentativi = dopo questi fallimenti la riga diventa FALLITA;
# in-corso-minuti = dopo quanto una riga rimasta IN_CORSO (l'app si è fermata a metà) torna da inviare; fallite-ore = dopo quante ore la pulizia notturna cancella
# le righe FALLITA (contengono il link con il token vero).
app.email.coda.attiva=true
app.email.coda.intervallo-ms=5000
app.email.coda.gruppo=20
app.email.coda.max-tentativi=5
app.email.coda.in-corso-minuti=10
app.email.coda.fallite-ore=24
