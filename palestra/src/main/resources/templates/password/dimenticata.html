<!DOCTYPE html>
<!--/*
  FILE: password/dimenticata.html
  A COSA SERVE: il modulo «Password dimenticata»: la persona scrive la propria email e, se esiste un account, riceve un link per sceglierne una nuova.
  Pagina PUBBLICA. Dopo l'invio PasswordController rimanda qui con ?inviata e si mostra SEMPRE lo stesso messaggio, che l'indirizzo esista o no:
  è voluto, per non rivelare quali email sono registrate. Riceve "richiestaEmailForm" (dati ed errori del modulo).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Password dimenticata</title>
</head>
<body>

<th:block layout:fragment="barra"></th:block>

<div layout:fragment="contenuto" class="card login">
  <h1>Password dimenticata</h1>

  <!--/* Messaggio identico per qualsiasi indirizzo. */-->
  <div class="ok" th:if="${param.inviata}">
    Se l'indirizzo è registrato, riceverai a breve un'email con il link per scegliere una nuova password. Il link vale poco tempo e si usa una sola volta.
  </div>

  <p class="aiuto-blocco">Scrivi l'email con cui accedi: ti invieremo un link per scegliere una nuova password.</p>
  <form th:action="@{/password-dimenticata}" th:object="${richiestaEmailForm}" method="post">
    <label for="email">Email</label>
    <input type="email" id="email" th:field="*{email}" autofocus required>
    <div class="campo-err" th:errors="*{email}"></div>
    <p><button type="submit">Invia il link</button></p>
  </form>
  <p><a th:href="@{/login}">← Torna all'accesso</a></p>
</div>

</body>
</html>
