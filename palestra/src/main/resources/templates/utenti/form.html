<!DOCTYPE html>
<!--/*
  FILE: utenti/form.html
  A COSA SERVE: un unico form usato sia per CREARE sia per MODIFICARE un utente.
  Riceve dal controller: "utenteForm" (dati e errori del form), "corsi" e "ruoli" (tutti, per le
  checkbox) e "utenteId" (null se nuovo, l'id se in modifica).
  Usa il layout layout/base.html (come @extends). Qui "admin" non è passato, quindi la barra
  di default non mostra il pulsante "Esci".
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Utente</title>
</head>
<body>

<main layout:fragment="contenuto">
  <div class="card">
    <!--/* Condizione ternaria: titolo diverso se utenteId è null (creazione) o no (modifica). */-->
    <h1 th:text="${utenteId == null} ? 'Nuovo utente' : 'Modifica utente'"></h1>

    <!--/* th:object lega il form a UtenteForm: dentro il form *{nome} significa utenteForm.nome.
           th:action sceglie dove inviare: POST /utenti (creazione) o POST /utenti/{id} (modifica).
           Il token CSRF viene aggiunto da solo. */-->
    <form th:object="${utenteForm}"
          th:action="${utenteId == null} ? @{/utenti} : @{/utenti/{id}(id=${utenteId})}"
          method="post">

      <!--/* Errori "globali" del form, cioè non legati a un campo (es. "Non puoi togliere il ruolo ADMIN
             all'ultimo amministratore"). #fields.globalErrors() li elenca; th:each ne fa un blocco per ciascuno.
             DEVE stare DENTRO il <form th:object>: #fields funziona solo rispetto all'oggetto del form. */-->
      <div class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>

      <!--/* th:field genera name="nome", id e value (rimette il valore già scritto se c'è un
             errore, come old('nome') in Blade). th:errors mostra gli errori di validazione del
             campo (come @error('nome')), ed è vuoto se non ce ne sono. */-->
      <label for="nome">Nome</label>
      <input type="text" id="nome" th:field="*{nome}">
      <div class="campo-err" th:errors="*{nome}"></div>

      <label for="cognome">Cognome</label>
      <input type="text" id="cognome" th:field="*{cognome}">
      <div class="campo-err" th:errors="*{cognome}"></div>

      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}">
      <div class="campo-err" th:errors="*{email}"></div>

      <!--/* Password: campo scritto a mano e NON con th:field, così il valore non viene mai rimesso nell'HTML
             dopo un errore. th:errors invece mostra gli errori di validazione del campo "password".
             Serve solo agli ADMIN (che fanno login); in modifica, lasciarla vuota significa "non cambiarla".
             autocomplete="new-password" impedisce al browser di riempirla con la password salvata. */-->
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password">
      <small class="aiuto" th:text="${utenteId == null} ? 'Obbligatoria solo per gli amministratori (min. 8 caratteri).' : 'Lascia vuoto per non cambiarla.'"></small>
      <div class="campo-err" th:errors="*{password}"></div>

      <!--/* Ruoli: una checkbox per ruolo (ADMIN, ISTRUTTORE, ISCRITTO). Stesso meccanismo dei corsi:
             th:field="*{ruoliIds}" + th:value spunta le caselle già assegnate e rimanda gli id scelti. */-->
      <label>Ruoli</label>
      <label class="check" th:each="r : ${ruoli}">
        <input type="checkbox" th:field="*{ruoliIds}" th:value="${r.id}">
        <span th:text="${r.nome}"></span>
      </label>

      <label>Corsi</label>
      <!--/* Una checkbox per ogni corso. th:field="*{corsiIds}" + th:value fa sì che la casella
             sia già spuntata se l'id del corso è nella lista corsiIds, e che i valori spuntati
             tornino al controller come lista di id. */-->
      <label class="check" th:each="c : ${corsi}">
        <input type="checkbox" th:field="*{corsiIds}" th:value="${c.id}">
        <span th:text="${c.nome + ' (' + c.livello + ', ' + c.durataMinuti + ' min)'}"></span>
      </label>

      <p>
        <button type="submit">Salva</button>
        <a class="btn btn-sec" th:href="@{/utenti}">Annulla</a>
      </p>
    </form>
  </div>
</main>

</body>
</html>
