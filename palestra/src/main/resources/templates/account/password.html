<!DOCTYPE html>
<!--/*
  FILE: account/password.html
  A COSA SERVE: la pagina "Cambia password" dell'utente loggato. Mostrata da AccountController (GET /account/password).
  Riceve dal controller: "cambiaPasswordForm" (errori dei campi) e "admin" (email di chi è loggato, per la barra).
  Il form invia POST /account/password, che cambia la PROPRIA password (l'utente viene dalla sessione, non dall'URL).
  Usa il layout layout/base.html.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Cambia password</title>
</head>
<body>

<main layout:fragment="contenuto">
  <div class="card card-stretta">
    <h1>Cambia password</h1>
    <p class="aiuto-blocco">
      Stai cambiando la password di <strong th:text="${admin}"></strong>.
      Per sicurezza devi prima scrivere quella attuale. La nuova deve avere almeno 8 caratteri.
      Dopo il cambio resti collegato; dal prossimo accesso userai la nuova.
    </p>

    <!--/* th:object lega il form a CambiaPasswordForm, così th:errors sa quali errori mostrare.
           I tre campi sono scritti a mano (name="...") e NON con th:field, per evitare che Thymeleaf rimetta nel
           campo il valore scritto dopo un errore: una password non deve mai tornare nell'HTML.
           autocomplete="current-password"/"new-password" dice al browser/gestore password che cosa è ogni campo.
           th:action aggiunge il token CSRF nascosto. */-->
    <form th:object="${cambiaPasswordForm}" th:action="@{/account/password}" method="post">

      <label for="passwordAttuale">Password attuale</label>
      <input type="password" id="passwordAttuale" name="passwordAttuale" autocomplete="current-password" autofocus>
      <div class="campo-err" th:errors="*{passwordAttuale}"></div>

      <label for="nuovaPassword">Nuova password</label>
      <input type="password" id="nuovaPassword" name="nuovaPassword" autocomplete="new-password">
      <small class="aiuto">Da 8 a 72 caratteri. Deve essere diversa da quella attuale.</small>
      <div class="campo-err" th:errors="*{nuovaPassword}"></div>

      <label for="confermaPassword">Ripeti la nuova password</label>
      <input type="password" id="confermaPassword" name="confermaPassword" autocomplete="new-password">
      <div class="campo-err" th:errors="*{confermaPassword}"></div>

      <p>
        <button type="submit">Cambia password</button>
        <a class="btn btn-sec" th:href="@{/utenti}">Annulla</a>
      </p>
    </form>
  </div>
</main>

</body>
</html>
