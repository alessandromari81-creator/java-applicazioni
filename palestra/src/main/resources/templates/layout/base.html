<!DOCTYPE html>
<!--/*
  FILE: layout/base.html
  A COSA SERVE: è il LAYOUT di base: contiene UNA SOLA VOLTA doctype, <html>, <head>, <body>,
  la barra in alto. Le pagine non ripetono questi tag: dichiarano "uso questo layout" e
  riempiono solo i "buchi" (i layout:fragment).
  COME SI USA: la pagina dichiara il layout con layout:decorate="~{layout/base}" sul proprio tag <html>. Nel layout un buco si
  scrive layout:fragment="contenuto"; la pagina lo riempie con un elemento che ha lo stesso layout:fragment="contenuto".
  Il nome dopo layout:fragment è quello che collega il buco del layout al contenuto della pagina.
  I commenti con questa sintassi (asterisco-slash) sono rimossi e non arrivano al browser.
*/-->
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <!--/* Titolo: $CONTENT_TITLE è il <title> scritto dalla pagina; qui ci aggiungiamo
         " - Palestra". Così ogni pagina scrive solo la sua parte. */-->
  <title layout:title-pattern="$CONTENT_TITLE - Palestra">Palestra</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!--/* BUCO "barra": la barra scura in alto, con contenuto di DEFAULT che le pagine possono
       sostituire (la pagina di login la sovrascrive con un blocco vuoto).
       Il pulsante "Esci" appare solo se la pagina ha passato "admin" (nome dell'utente loggato).
       Il logout è un POST: th:action aggiunge da solo il token CSRF */-->
<header layout:fragment="barra">
  <strong>Palestra · Pannello di controllo</strong>
  <!--/* Menu di navigazione: presente in tutte le pagine che usano la barra di default. */-->
  <nav>
    <a th:href="@{/utenti}">Utenti</a>
    <a th:href="@{/corsi}">Corsi</a>
    <a th:href="@{/abbonamenti}">Abbonamenti</a>
  </nav>
  <form th:if="${admin != null}" th:action="@{/logout}" method="post">
    <!--/* Link alla pagina "Cambia password" (AccountController), visibile a chi è loggato. */-->
    <a class="link-barra" th:href="@{/account/password}">Cambia password</a>
    <span th:text="${admin}"></span>
    <button type="submit" class="btn-sec">Esci</button>
  </form>
</header>

<!--/* MESSAGGI GLOBALI: mostrati in OGNI pagina che usa il layout, sotto la barra e sopra il
       contenuto. Arrivano dai controller con flash.addFlashAttribute("messaggio", ...) o
       ("errore", ...) prima di un redirect (valgono solo per la pagina successiva, poi spariscono). th:if mostra il blocco solo se il valore esiste,
       th:text ne scrive il testo (con escape dei caratteri speciali).
       Per aggiungere un nuovo tipo di messaggio basta una riga qui e una classe nel CSS. */-->
<div class="messaggi">
  <div class="ok" th:if="${messaggio}" th:text="${messaggio}"></div>
  <div class="err" th:if="${errore}" th:text="${errore}"></div>
</div>

<!--/* BUCO "contenuto": qui finisce il corpo di ciascuna pagina. */-->
<div layout:fragment="contenuto">Contenuto della pagina</div>

</body>
</html>
