<!DOCTYPE html>
<!--/*
  FILE: corsi/form.html
  A COSA SERVE: form unico per CREARE e MODIFICARE un corso.
  Riceve: "corsoForm" (dati ed errori), "livelli" (valori per la tendina), "istruttori" (gli utenti con ruolo
  ISTRUTTORE tra cui scegliere), "corsoId" (null se nuovo, l'id se in modifica). Usa il layout layout/base.html.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Corso</title>
</head>
<body>

<main layout:fragment="contenuto">
  <div class="card">
    <h1 th:text="${corsoId == null} ? 'Nuovo corso' : 'Modifica corso'"></h1>

    <!--/* th:object lega il form a CorsoForm; th:action sceglie POST /corsi (nuovo) oppure
           POST /corsi/{id} (modifica). th:field e th:errors funzionano come nel form utenti. */-->
    <form th:object="${corsoForm}"
          th:action="${corsoId == null} ? @{/corsi} : @{/corsi/{id}(id=${corsoId})}"
          method="post">

      <label for="nome">Nome</label>
      <input type="text" id="nome" th:field="*{nome}">
      <div class="campo-err" th:errors="*{nome}"></div>

      <label for="descrizione">Descrizione</label>
      <input type="text" id="descrizione" th:field="*{descrizione}">
      <div class="campo-err" th:errors="*{descrizione}"></div>

      <label for="durataMinuti">Durata (minuti)</label>
      <input type="number" id="durataMinuti" th:field="*{durataMinuti}" min="1">
      <div class="campo-err" th:errors="*{durataMinuti}"></div>

      <!--/* Tendina (<select>): una <option> per ogni valore dell'enum Livello. th:field
             seleziona da solo l'opzione corrispondente al valore attuale. */-->
      <label for="livello">Livello</label>
      <select id="livello" th:field="*{livello}">
        <option value="">-- scegli --</option>
        <option th:each="l : ${livelli}" th:value="${l}" th:text="${l}"></option>
      </select>
      <div class="campo-err" th:errors="*{livello}"></div>

      <!--/* Tendina dell'istruttore: elenca SOLO gli utenti con ruolo ISTRUTTORE (${istruttori}, preparata da
             CorsoController). La prima voce vuota significa "nessun istruttore" (facoltativo). th:field seleziona da
             solo quello attuale in modifica. Le regole (ruolo ISTRUTTORE, non iscritto al corso) sono controllate
             dal server in CorsoService.erroreSullIstruttore, perché la tendina da sola non basta come protezione. */-->
      <label for="istruttoreId">Istruttore</label>
      <select id="istruttoreId" th:field="*{istruttoreId}">
        <option value="">-- nessuno --</option>
        <option th:each="i : ${istruttori}" th:value="${i.id}" th:text="${i.cognome + ' ' + i.nome}"></option>
      </select>
      <small class="aiuto">
        Compaiono solo gli utenti con ruolo ISTRUTTORE (assegnalo dalla pagina Utenti). Un istruttore può tenere più
        corsi, ma non può essere iscritto come allievo al corso che tiene: se lo è già, togli prima la sua iscrizione.
        <span th:if="${istruttori.isEmpty()}"><strong>Non c'è ancora nessun istruttore.</strong></span>
      </small>
      <div class="campo-err" th:errors="*{istruttoreId}"></div>

      <p>
        <button type="submit">Salva</button>
        <a class="btn btn-sec" th:href="@{/corsi}">Annulla</a>
      </p>
    </form>
  </div>
</main>

</body>
</html>
