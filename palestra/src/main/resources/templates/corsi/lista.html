<!DOCTYPE html>
<!--/*
  FILE: corsi/lista.html
  A COSA SERVE: elenco PAGINATO dei corsi (con ricerca e ordinamento) con i pulsanti Modifica / Elimina / Nuovo corso.
  Mostrata da CorsoController.lista(). Riceve: "corsi" (lista), "admin" (nome loggato),
  "messaggio" e "errore" (flash, opzionali: li mostra il layout). Usa il layout layout/base.html.
  Ogni corso mostra il suo istruttore (c.istruttore, che può mancare: corso non ancora assegnato).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Corsi</title>
</head>
<body>

<main layout:fragment="contenuto">
  <div class="card">
    <div class="top">
      <h1>Corsi</h1>
      <a class="btn" th:href="@{${'/corsi/nuovo' + lista.querystring}}">+ Nuovo corso</a>
    </div>

    <!--/* Spiegazione visibile della relazione corso-istruttore e delle sue regole. */-->
    <p class="aiuto-blocco">
      Ogni corso ha al massimo un <strong>istruttore</strong>, scelto tra gli utenti con ruolo ISTRUTTORE;
      un istruttore può tenere più corsi. Un istruttore non può essere iscritto come allievo al corso che tiene.
    </p>

    <!--/* RICERCA e controlli di pagina: pezzi riusabili in fragments/paginazione.html (logica in NavigazionePagine). */-->
    <th:block th:replace="~{fragments/paginazione :: ricerca(${nav}, 'Cerca per nome del corso')}"></th:block>

    <table>
      <thead><tr><th:block th:replace="~{fragments/paginazione :: intestazione(${nav}, 'nome', 'Nome')}"></th:block><th:block th:replace="~{fragments/paginazione :: intestazione(${nav}, 'livello', 'Livello')}"></th:block><th:block th:replace="~{fragments/paginazione :: intestazione(${nav}, 'durataMinuti', 'Durata')}"></th:block><th>Descrizione</th><th>Istruttore</th><th></th></tr></thead>
      <tbody>
        <tr th:each="c : ${corsi}">
          <td th:text="${c.nome}"></td>
          <td th:text="${c.livello}"></td>
          <td th:text="${c.durataMinuti + ' min'}"></td>
          <td th:text="${c.descrizione}"></td>
          <!--/* Istruttore del corso, oppure un trattino se non è ancora assegnato. L'istruttore è già caricato
                 insieme al corso (@EntityGraph in CorsoRepository), quindi non parte una query per ogni riga. */-->
          <td th:text="${c.istruttore != null} ? ${c.istruttore.cognome + ' ' + c.istruttore.nome} : '–'"></td>
          <td class="col-azioni">
            <!--/* I pulsanti stanno in un <div class="azioni"> DENTRO la cella: la classe .azioni usa display:flex,
                   e applicata direttamente a un <td> la romperebbe come cella di tabella (le colonne sbordavano). */-->
            <div class="azioni">
              <a class="btn btn-sec" th:href="@{${'/corsi/' + c.id + '/modifica' + lista.querystring}}">Modifica</a>
              <form th:action="@{/corsi/{id}/elimina(id=${c.id})}" method="post"
                    onsubmit="return confirm('Eliminare questo corso?')">
                <th:block th:replace="~{fragments/paginazione :: statoNascosto(${lista})}"></th:block>
              <button type="submit" class="btn-danger">Elimina</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${corsi.isEmpty()}"><td colspan="6">Nessun corso.</td></tr>
      </tbody>
    </table>
    <th:block th:replace="~{fragments/paginazione :: barra(${nav})}"></th:block>
  </div>
</main>

</body>
</html>
