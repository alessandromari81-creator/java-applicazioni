<!DOCTYPE html>
<!--/*
  FILE: login.html
  A COSA SERVE: pagina di login. Mostrata da HomeController.login() (GET /login restituisce
  "login" -> questo file). Spring Security ci rimanda chi non è loggato.
  È un template Thymeleaf: HTML normale con attributi th:* elaborati dal server.
  COME USA IL LAYOUT: layout:decorate sul tag <html> equivale a @extends('layouts.app').
  Il <head> e il <body> di base arrivano da layout/base.html: qui scriviamo solo ciò che cambia.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <!--/* Questo <title> viene fuso nel layout: diventa "Login - Palestra". */-->
  <title>Login</title>
</head>
<body>

<!--/* Nel login NON vogliamo la barra: riempiamo il buco "barra" con un blocco vuoto
       (come @section('barra') vuoto per sovrascrivere il default). */-->
<th:block layout:fragment="barra"></th:block>

<!--/* Riempie il buco "contenuto" del layout (come @section('contenuto')). */-->
<div layout:fragment="contenuto" class="card login">
  <h1>Accedi</h1>
  <!--/* Spring Security rimanda a /login?error se le credenziali sono sbagliate e a
         /login?logout dopo l'uscita: ${param.error} legge questi parametri dell'URL. */-->
  <div class="err" th:if="${param.error}">Credenziali non valide</div>
  <div class="ok" th:if="${param.logout}">Sei uscito correttamente</div>

  <!--/* th:action aggiunge automaticamente il token CSRF nascosto (come @csrf in Blade).
         Il form invia POST /login: lo elabora Spring Security, non un nostro controller.
         I nomi "username" e "password" sono quelli che Spring Security si aspetta. */-->
  <form th:action="@{/login}" method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <p><button type="submit">Entra</button></p>
  </form>
</div>

</body>
</html>
